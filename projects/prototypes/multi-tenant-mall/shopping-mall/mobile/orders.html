<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订购</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary-color: #E8593C;
            --bg-color: #FFF8F6;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        
        .header {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #fff;
        }
        
        .back-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-right: 10px;
        }
        .back-btn svg { width: 16px; height: 16px; color: #666; }
        
        .header-title { font-size: 18px; font-weight: 600; }
        
        .content { padding: 20px; }
        
        .order-card {
            background: #fff;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 12px;
        }
        
        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .member-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .member-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .member-icon.gold { background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); color: #8B4513; }
        .member-icon.silver { background: #E0E0E0; color: #888; }
        
        .member-detail {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .member-name { font-size: 16px; font-weight: 600; color: #333; }
        .member-desc { font-size: 12px; color: #999; }
        .member-extra { font-size: 11px; color: #999; margin-top: 2px; }
        
        .status-tag {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 15px;
            font-weight: 500;
        }
        
        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 24px;
        }
        
        .status-active { background: rgba(72, 187, 120, 0.1); color: #48BB78; }
        .status-expired { background: #F5F5F5; color: #999; }
        
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        
        .btn-cancel {
            background: rgba(232,89,60,0.1);
            color: var(--primary-color);
            margin-top: 20px;
        }
        
        .btn-reorder {
            background: var(--primary-color);
            color: #fff;
            margin-top: 20px;
        }
        
        .btn-benefit {
            background: var(--primary-color);
            color: #fff;
            margin-top: 20px;
        }
        
        .btn-sm {
            padding: 6px 16px;
            font-size: 12px;
            border-radius: 12px;
        }
        
        .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:400px; background:#fff; border-top:1px solid #E8E8E8; display:flex; justify-content:space-around; padding:8px 0 22px; z-index:100; }
        .tab-item { display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; padding:4px 20px; }
        .tab-item svg { width:24px; height:24px; }
        .tab-label { font-size:10px; font-weight:500; }
        .tab-item.active svg, .tab-item.active .tab-label { color:var(--primary-color); }
        .tab-item:not(.active) svg, .tab-item:not(.active) .tab-label { color:#BBB; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back-btn" onclick="window.location.href='profile.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </div>
            <div class="header-title">我的订购</div>
        </div>
        
        <div class="content">
            <div class="order-card">
                <div class="card-header">
                    <div class="member-detail">
                        <div class="member-name">黄金会员</div>
                        <div class="member-desc">连续包月 · 有效期至 2026-02-28</div>
                    </div>
                    <div class="header-right">
                        <div class="status-tag status-active">生效中</div>
                        <button class="btn btn-sm btn-benefit" onclick="window.location.href='benefit-detail.html'">领取权益</button>
                    </div>
                </div>
            </div>
            
            <div class="order-card">
                <div class="card-header">
                    <div class="member-detail">
                        <div class="member-name">白银会员</div>
                        <div class="member-desc">已停止续费 · 有效期至 2025-12-08</div>
                    </div>
                    <div class="header-right">
                        <div class="status-tag status-expired">已过期</div>
                        <button class="btn btn-sm btn-reorder" onclick="window.location.href='package-detail.html'">重新订购</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="tabbar">
            <div class="tab-item" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10z"/><path d="M9 21v-7h6v7"/></svg><span class="tab-label">首页</span></div>
            <div class="tab-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18"/></svg><span class="tab-label">订单</span></div>
            <div class="tab-item" onclick="window.location.href='profile.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4.5"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span class="tab-label">我的</span></div>
        </div>
    </div>
    
    <script>
        function confirmCancel() {
            if (confirm('确定要取消订购吗？取消后，会员权益将在当前周期结束后停止。')) {
                alert('取消订购成功！');
            }
        }
    </script>
</body>
</html>
