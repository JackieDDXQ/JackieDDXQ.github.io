<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>觉观商城 - 首页2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #fff8f0;
            color: #333;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #fff;
            min-height: 100vh;
        }
        
        .header {
            padding: 20px;
            background: linear-gradient(135deg, #ff7a45, #fa8c16);
            color: #fff;
            text-align: center;
        }
        
        .header h1 {
            font-size: 22px;
            font-weight: 600;
        }
        
        /* 顶部导航 */
        .top-nav {
            background-color: #fff;
            border-bottom: 2px solid #ff7a45;
            padding: 10px 20px;
        }
        
        .nav-tabs {
            display: flex;
            justify-content: space-around;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: #666;
            padding: 5px 0;
        }
        
        .nav-item.active {
            color: #ff7a45;
            border-bottom: 2px solid #ff7a45;
        }
        
        .nav-item span {
            font-size: 14px;
            margin-top: 5px;
        }
        
        .content {
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #ff7a45;
            border-left: 4px solid #ff7a45;
            padding-left: 10px;
        }
        
        /* 列表式布局 */
        .package-list {
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(255, 122, 69, 0.15);
        }
        
        .package-item {
            padding: 15px;
            border-bottom: 1px solid #fff8f0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .package-item:hover {
            background-color: #fff8f0;
        }
        
        .package-item:last-child {
            border-bottom: none;
        }
        
        .package-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        
        .package-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        .package-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 15px;
            background-color: #fff2e8;
            color: #fa8c16;
            font-weight: 500;
        }
        
        .package-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .package-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .package-price {
            font-size: 18px;
            font-weight: 600;
            color: #ff4d4f;
        }
        
        .package-price span {
            font-size: 12px;
            color: #999;
            text-decoration: line-through;
            margin-left: 5px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ff7a45, #fa8c16);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 122, 69, 0.3);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #52c41a, #73d13d);
            color: #fff;
        }
        
        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(82, 196, 26, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>会员商城</h1>
        </div>
        
        <!-- 顶部导航 -->
        <div class="top-nav">
            <div class="nav-tabs">
                <div class="nav-item active">
                    <span>首页</span>
                </div>
                <div class="nav-item" onclick="window.location.href='profile.html'">
                    <span>个人中心</span>
                </div>
            </div>
        </div>
        
        <div class="content">
            <!-- 我的订购 -->
            <div class="section">
                <div class="section-title">我的订购</div>
                
                <div class="package-list">
                    <div class="package-item" onclick="window.location.href='benefit-detail.html'">
                        <div class="package-header">
                            <div class="package-name">黄金会员</div>
                            <div class="package-status">已生效</div>
                        </div>
                        <div class="package-info">有效期至：2026-02-08</div>
                        <div class="package-actions">
                            <div class="package-price">¥19.9/月</div>
                            <button class="btn btn-success">领取权益</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 更多商品 -->
            <div class="section">
                <div class="section-title">更多商品</div>
                
                <div class="package-list">
                    <div class="package-item" onclick="window.location.href='package-detail.html'">
                        <div class="package-header">
                            <div class="package-name">黄金会员</div>
                        </div>
                        <div class="package-info">享受10+项专属权益，每月更新</div>
                        <div class="package-actions">
                            <div class="package-price">¥19.9/月 <span>¥29.9</span></div>
                            <button class="btn btn-primary">立即订购</button>
                        </div>
                    </div>
                    
                    <div class="package-item" onclick="window.location.href='package-detail.html'">
                        <div class="package-header">
                            <div class="package-name">铂金会员</div>
                        </div>
                        <div class="package-info">享受20+项专属权益，每月更新</div>
                        <div class="package-actions">
                            <div class="package-price">¥29.9/月 <span>¥39.9</span></div>
                            <button class="btn btn-primary">立即订购</button>
                        </div>
                    </div>
                    
                    <div class="package-item" onclick="window.location.href='package-detail.html'">
                        <div class="package-header">
                            <div class="package-name">钻石会员</div>
                        </div>
                        <div class="package-info">享受30+项专属权益，每月更新</div>
                        <div class="package-actions">
                            <div class="package-price">¥39.9/月 <span>¥49.9</span></div>
                            <button class="btn btn-primary">立即订购</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
