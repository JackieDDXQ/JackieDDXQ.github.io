
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lingxiao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.lingxiao.entity

logging:
  level:
    com.example.lingxiao: debug
