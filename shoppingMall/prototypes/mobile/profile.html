<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #E8593C;
            --primary-light: #F5925E;
            --primary-dark: #D64525;
            --header-gradient: linear-gradient(145deg, #D64525 0%, #E8593C 45%, #F5925E 100%);
            --bg: #FFF6F2;
            --surface: #FFFFFF;
            --text-primary: #333;
            --text-secondary: #666;
            --text-light: #999;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg);
            padding-bottom: 88px;
        }

        .hdr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }
        .back-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-right: 10px;
        }
        .back-btn svg { width: 16px; height: 16px; color: #666; }
        .hdr-title { 
            font-size: 18px; 
            font-weight: 600; 
        }
        .hdr-left {
            display: flex;
            align-items: center;
        }

        .user-section {
            padding: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        .user-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(232,89,60,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
        }
        .user-avatar svg { width: 28px; height: 28px; color: var(--primary); }
        
        .user-detail {
            flex: 1;
        }
        .user-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .user-phone {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .member-card {
            background: linear-gradient(135deg, #E8593C 0%, #F5925E 100%);
            border-radius: 16px;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            margin-bottom: 16px;
        }
        .member-info {
            display: flex;
            flex-direction: column;
        }
        .member-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .member-expire {
            font-size: 12px;
            opacity: 0.85;
        }
        .member-savings {
            text-align: right;
        }
        .savings-amount {
            font-size: 24px;
            font-weight: 700;
        }
        .savings-label {
            font-size: 11px;
            opacity: 0.85;
        }

        .stats-row {
            display: flex;
            background: #fff;
            border-radius: 14px;
            padding: 18px 0;
            margin-bottom: 12px;
        }
        .stat-item {
            flex: 1;
            text-align: center;
        }
        .stat-num {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .menu-list {
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        
        .menu-section {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .menu-section:last-child {
            border-bottom: none;
        }
        
        .menu-section-title {
            padding: 0 20px 10px;
            font-size: 12px;
            color: var(--text-light);
        }
        
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .menu-item:hover {
            background: #f8f8f8;
        }
        .menu-item.logout {
            color: var(--primary);
        }
        
        .menu-text {
            font-size: 15px;
        }
        
        .menu-right {
            display: flex;
            align-items: center;
        }
        
        .menu-badge {
            font-size: 12px;
            color: var(--text-light);
            margin-right: 8px;
        }
        
        .menu-arrow {
            width: 12px;
            height: 12px;
        }
        .menu-arrow svg { width: 12px; height: 12px; color: #ccc; }

        .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:400px; background:rgba(255,255,255,0.95); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid rgba(0,0,0,0.04); display:flex; justify-content:space-around; padding:8px 0 22px; z-index:100; }
        .tab-item { display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; text-decoration:none; padding:4px 20px; }
        .tab-item svg { width:24px; height:24px; }
        .tab-label { font-size:10px; font-weight:500; }
        .tab-item.active svg { color:var(--primary); }
        .tab-item.active .tab-label { color:var(--primary); font-weight:600; }
        .tab-item:not(.active) svg { color:#BBB; }
        .tab-item:not(.active) .tab-label { color:#BBB; }
    </style>
</head>
<body>
    <div class="container">
        <div class="hdr">
            <div class="hdr-left">
                <div class="back-btn" onclick="window.history.back()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 19l-7-7 7-7"></path>
                    </svg>
                </div>
                <div class="hdr-title">个人中心</div>
            </div>
        </div>

        <div class="user-section">
            <div class="user-info">
                <div class="user-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="user-detail">
                    <div class="user-name">张小明</div>
                    <div class="user-phone">138****8888</div>
                </div>
            </div>

            <div class="member-card">
                <div class="member-info">
                    <div class="member-title">黄金会员</div>
                    <div class="member-expire">有效期至 2026-02-08</div>
                </div>
                <div class="member-savings">
                    <div class="savings-amount">¥60</div>
                    <div class="savings-label">累计节省</div>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-num">1</div>
                    <div class="stat-label">在订会员</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num">3</div>
                    <div class="stat-label">已领权益</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num">3</div>
                    <div class="stat-label">待领取</div>
                </div>
            </div>

            <div class="menu-list">
                <div class="menu-section">
                    <div class="menu-section-title">常用功能</div>
                    <div class="menu-item" onclick="window.location.href='orders.html'">
                        <span class="menu-text">我的订购</span>
                        <div class="menu-right">
                            <span class="menu-badge">1笔在订</span>
                            <div class="menu-arrow">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 18l6-6-6-6"></path>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="menu-item" onclick="window.location.href='benefit-detail.html'">
                        <span class="menu-text">我的权益</span>
                        <div class="menu-right">
                            <span class="menu-badge">3项待领</span>
                            <div class="menu-arrow">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 18l6-6-6-6"></path>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="menu-section">
                    <div class="menu-section-title">其他</div>
                    <div class="menu-item" onclick="window.location.href='help-center.html'">
                        <span class="menu-text">帮助中心</span>
                        <div class="menu-arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 18l6-6-6-6"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="menu-item logout" onclick="logout()">
                        <span class="menu-text">退出登录</span>
                        <div class="menu-arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 18l6-6-6-6"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tabbar">
            <div class="tab-item" onclick="window.location.href='index.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="tab-label">首页</span>
            </div>
            <div class="tab-item" onclick="window.location.href='orders.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18"/></svg><span class="tab-label">订单</span></div>
            <div class="tab-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4.5"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span class="tab-label">我的</span></div>
        </div>
    </div>

    <script>
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
