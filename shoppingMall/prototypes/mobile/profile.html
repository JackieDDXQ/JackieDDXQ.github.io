<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #fff;
            min-height: 100vh;
        }
        
        .header {
            padding: 20px;
            background-color: #1890ff;
            color: #fff;
            text-align: center;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 500;
        }
        
        .user-info {
            background-color: #1890ff;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        
        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        
        .user-name {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .user-phone {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .menu-list {
            margin: 15px;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-item:hover {
            background-color: #fafafa;
        }
        
        .menu-text {
            font-size: 16px;
        }
        
        .menu-arrow {
            font-size: 16px;
            color: #999;
        }
        
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #fff;
            border-top: 1px solid #e8e8e8;
            padding: 10px 20px;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .nav-tabs {
            display: flex;
            justify-content: space-around;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: #666;
        }
        
        .nav-item.active {
            color: #1890ff;
        }
        
        .nav-item span {
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">个人中心</div>
        </div>
        
        <div class="user-info">
            <div class="user-avatar">用</div>
            <div class="user-phone">138****8888</div>
        </div>
        
        <div class="menu-list">
            <div class="menu-item" onclick="window.location.href='orders.html'">
                <div class="menu-text">我的订购</div>
                <div class="menu-arrow">→</div>
            </div>
            <div class="menu-item" onclick="window.location.href='help-center.html'">
                <div class="menu-text">帮助中心</div>
                <div class="menu-arrow">→</div>
            </div>
            <div class="menu-item" onclick="logout()">
                <div class="menu-text">退出登录</div>
                <div class="menu-arrow">→</div>
            </div>
        </div>
        
        <div class="footer">
            <div class="nav-tabs">
                <div class="nav-item" onclick="window.location.href='index.html'">
                    <span>首页</span>
                </div>
                <div class="nav-item active">
                    <span>个人中心</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 退出登录功能
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                // 这里可以添加实际的退出登录逻辑，例如清除本地存储的用户信息等
                alert('已退出登录');
                // 可以跳转到登录页面，这里暂时返回首页
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
