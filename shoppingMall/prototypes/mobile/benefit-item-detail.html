<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权益详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-color: #E8593C;
            --bg-color: #FFF6F2;
            --surface: #FFFFFF;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-light: #999999;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding-bottom: 20px;
        }
        
        .header {
            padding: 20px;
            background: #fff;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .back-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-right: 10px;
        }
        .back-btn svg { width: 16px; height: 16px; color: #666; }
        
        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        .content {
            padding: 25px 20px;
        }
        
        .benefit-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .benefit-icon {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            background: rgba(232,89,60,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .benefit-icon svg { width: 40px; height: 40px; color: var(--primary-color); }
        
        .benefit-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        .benefit-subtitle {
            font-size: 14px;
            color: var(--text-light);
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .btn-primary {
            background: var(--primary-color);
            color: #fff;
        }
        
        .benefit-detail-card {
            background-color: #fff;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
        }
        
        .card-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--primary-color);
            border-radius: 2px;
            margin-right: 10px;
        }
        
        .benefit-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 12px;
        }
        
        .benefit-description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .benefit-meta {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 8px;
        }
        
        .benefit-meta:last-child {
            margin-bottom: 0;
        }
        
        .use-instructions {
            list-style: none;
            padding: 0;
        }
        
        .instruction-item {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding-left: 22px;
            position: relative;
            line-height: 1.5;
        }
        
        .instruction-item:last-child {
            margin-bottom: 0;
        }
        
        .instruction-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: var(--primary-color);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back-btn" onclick="window.location.href='benefit-detail.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </div>
            <div class="header-title">权益详情</div>
        </div>
        
        <div class="content">
            <div class="benefit-header">
                <div class="benefit-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="6" width="20" height="14" rx="2"/>
                        <path d="M16 2v4"/>
                        <path d="M8 2v4"/>
                        <path d="M8 10h8"/>
                    </svg>
                </div>
                <div class="benefit-title">麦当劳优惠券</div>
                <div class="benefit-subtitle">满50减20优惠券</div>
            </div>
            
            <button class="btn btn-primary" onclick="claimBenefit()">立即领取</button>
            
            <div class="benefit-detail-card">
                <div class="card-title">权益详情</div>
                <div class="benefit-value">价值：¥20</div>
                <div class="benefit-description">
                    凭此券在全国麦当劳门店消费满50元可立减20元，适用于堂食、外带和外送服务。
                </div>
                <div class="benefit-meta">有效期：2025-12-31</div>
                <div class="benefit-meta">适用范围：全国麦当劳门店</div>
                <div class="benefit-meta">使用次数：1次</div>
            </div>
            
            <div class="benefit-detail-card">
                <div class="card-title">使用说明</div>
                <ul class="use-instructions">
                    <li class="instruction-item">领取后优惠券将存入您的账户</li>
                    <li class="instruction-item">消费时出示优惠券二维码即可使用</li>
                    <li class="instruction-item">每笔订单限用一张优惠券</li>
                    <li class="instruction-item">每笔订单限用一张优惠券</li>
                    <li class="instruction-item">不可与其他优惠活动叠加使用</li>
                    <li class="instruction-item">过期未使用的优惠券将自动失效</li>
                </ul>
            </div>
        </div>
    </div>
    
    <script>
        function claimBenefit() {
            alert('领取成功！优惠券已存入您的账户');
            window.location.href = 'benefit-detail.html';
        }
    </script>
</body>
</html>
