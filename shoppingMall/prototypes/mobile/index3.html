<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>觉观商城 - 首页3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f0f5ff;
            color: #333;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            min-height: 100vh;
            background: linear-gradient(180deg, #1890ff, #69c0ff 200px, #f0f5ff 200px);
            padding-bottom: 80px;
        }
        
        /* 圆角顶部区域 */
        .header {
            padding: 40px 20px 20px;
            text-align: center;
            color: #fff;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .header-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        /* 导航卡片 */
        .nav-card {
            background-color: #fff;
            margin: 0 20px 20px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(24, 144, 255, 0.15);
        }
        
        .nav-tabs {
            display: flex;
            padding: 10px;
        }
        
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .nav-item.active {
            background-color: #e6f7ff;
            color: #1890ff;
            font-weight: 500;
        }
        
        /* 内容区域 */
        .content {
            padding: 0 20px;
        }
        
        .section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #1890ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .section-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 20px;
            background-color: #1890ff;
            border-radius: 4px;
            margin-right: 10px;
        }
        
        /* 我的订购卡片 */
        .my-order-card {
            background-color: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(24, 144, 255, 0.15);
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .order-name {
            font-size: 20px;
            font-weight: 600;
            color: #1890ff;
        }
        
        .order-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 15px;
            background-color: #e6f7ff;
            color: #1890ff;
            font-weight: 500;
        }
        
        .order-info {
            background-color: #f0f5ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .info-row:last-child {
            margin-bottom: 0;
        }
        
        .info-label {
            color: #666;
            font-size: 14px;
        }
        
        .info-value {
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }
        
        .order-actions {
            display: flex;
            gap: 10px;
        }
        
        /* 商品网格布局 */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .product-card {
            background-color: #fff;
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(24, 144, 255, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(24, 144, 255, 0.2);
        }
        
        .product-icon {
            font-size: 32px;
            margin-bottom: 12px;
            color: #1890ff;
        }
        
        .product-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }
        
        .product-desc {
            font-size: 12px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .product-price {
            font-size: 18px;
            font-weight: 600;
            color: #ff4d4f;
            margin-bottom: 12px;
        }
        
        .product-price span {
            font-size: 12px;
            color: #999;
            text-decoration: line-through;
        }
        
        /* 按钮样式 */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: #1890ff;
            color: #fff;
            flex: 1;
        }
        
        .btn-primary:hover {
            background-color: #40a9ff;
            box-shadow: 0 4px 12px rgba(24, 144, 255, 0.3);
        }
        
        .btn-success {
            background-color: #52c41a;
            color: #fff;
            flex: 1;
        }
        
        .btn-success:hover {
            background-color: #73d13d;
            box-shadow: 0 4px 12px rgba(82, 196, 26, 0.3);
        }
        
        /* 底部固定按钮 */
        .bottom-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1890ff;
            color: #fff;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(24, 144, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .bottom-btn:hover {
            background-color: #40a9ff;
            box-shadow: 0 6px 20px rgba(24, 144, 255, 0.4);
            transform: translateX(-50%) translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>会员商城</h1>
            <div class="header-subtitle">专属会员权益，尽在掌握</div>
        </div>
        
        <!-- 导航卡片 -->
        <div class="nav-card">
            <div class="nav-tabs">
                <div class="nav-item active">
                    首页
                </div>
                <div class="nav-item" onclick="window.location.href='profile.html'">
                    个人中心
                </div>
            </div>
        </div>
        
        <div class="content">
            <!-- 我的订购 -->
            <div class="section">
                <div class="section-title">我的订购</div>
                
                <div class="my-order-card">
                    <div class="order-header">
                        <div class="order-name">黄金会员</div>
                        <div class="order-status">已生效</div>
                    </div>
                    
                    <div class="order-info">
                        <div class="info-row">
                            <div class="info-label">有效期至</div>
                            <div class="info-value">2026-02-08</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">每月价格</div>
                            <div class="info-value">¥19.9</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">订购日期</div>
                            <div class="info-value">2025-12-08</div>
                        </div>
                    </div>
                    
                    <div class="order-actions">
                        <button class="btn btn-success" onclick="window.location.href='benefit-detail.html'">领取权益</button>
                    </div>
                </div>
            </div>
            
            <!-- 更多商品 -->
            <div class="section">
                <div class="section-title">热门会员</div>
                
                <div class="products-grid">
                    <!-- 黄金会员 -->
                    <div class="product-card" onclick="window.location.href='package-detail.html'">

                        <div class="product-name">黄金会员</div>
                        <div class="product-desc">10+项专属权益</div>
                        <div class="product-price">¥19.9 <span>¥29.9</span></div>
                        <button class="btn btn-primary">立即订购</button>
                    </div>
                    
                    <!-- 铂金会员 -->
                    <div class="product-card" onclick="window.location.href='package-detail.html'">

                        <div class="product-name">铂金会员</div>
                        <div class="product-desc">20+项专属权益</div>
                        <div class="product-price">¥29.9 <span>¥39.9</span></div>
                        <button class="btn btn-primary">立即订购</button>
                    </div>
                    
                    <!-- 钻石会员 -->
                    <div class="product-card" onclick="window.location.href='package-detail.html'">

                        <div class="product-name">钻石会员</div>
                        <div class="product-desc">30+项专属权益</div>
                        <div class="product-price">¥39.9 <span>¥49.9</span></div>
                        <button class="btn btn-primary">立即订购</button>
                    </div>
                    
                    <!-- 超值套餐 -->
                    <div class="product-card" onclick="window.location.href='package-detail.html'">

                        <div class="product-name">年度套餐</div>
                        <div class="product-desc">全年尊享权益</div>
                        <div class="product-price">¥199 <span>¥299</span></div>
                        <button class="btn btn-primary">立即订购</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 底部按钮 -->
        <button class="bottom-btn" onclick="window.location.href='package-detail.html'">
            了解更多会员权益
        </button>
    </div>
</body>
</html>
