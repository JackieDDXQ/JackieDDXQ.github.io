<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>已订购</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #fff;
            min-height: 100vh;
        }
        
        .header {
            padding: 20px;
            background-color: #1890ff;
            color: #fff;
            display: flex;
            align-items: center;
        }
        
        .back-btn {
            font-size: 20px;
            cursor: pointer;
            margin-right: 20px;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 500;
        }
        
        .content {
            padding: 20px;
        }
        
        .order-list {
            margin-bottom: 80px;
        }
        
        .order-item {
            background-color: #fafafa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .order-name {
            font-size: 16px;
            font-weight: 500;
        }
        
        .order-status {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 10px;
            background-color: #e6f7ff;
            color: #1890ff;
        }
        
        .order-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .order-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .order-price {
            font-size: 18px;
            font-weight: 500;
            color: #ff4d4f;
        }
        
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .btn-primary {
            background-color: #1890ff;
            color: #fff;
        }
        
        .btn-primary:hover {
            background-color: #40a9ff;
        }
        
        .btn-danger {
            background-color: #ff4d4f;
            color: #fff;
        }
        
        .btn-danger:hover {
            background-color: #ff7875;
        }
        
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #fff;
            border-top: 1px solid #e8e8e8;
            padding: 10px 20px;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .nav-tabs {
            display: flex;
            justify-content: space-around;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: #666;
        }
        
        .nav-item.active {
            color: #1890ff;
        }
        
        .nav-item span {
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back-btn" onclick="window.location.href='profile.html'">
                <span>←</span>
            </div>
            <div class="header-title">我的订购</div>
        </div>
        
        <div class="content">
            <div class="order-list">
                <div class="order-item">
                    <div class="order-header">
                        <div class="order-name">黄金会员</div>
                        <div class="order-status">已生效</div>
                    </div>
                    <div class="order-info">
                        <div>有效期至：2026-02-28</div>
                        <div>自动续费：已开启</div>
                    </div>
                    <div class="order-actions">
                        <div class="order-price">¥19.9/月</div>
                        <button class="btn btn-danger" onclick="confirmCancel()">取消订购</button>
                    </div>
                </div>
                
                <div class="order-item">
                    <div class="order-header">
                        <div class="order-name">白银会员</div>
                        <div class="order-status">已过期</div>
                    </div>
                    <div class="order-info">
                        <div>有效期至：2025-12-08</div>
                        <div>自动续费：已关闭</div>
                    </div>
                    <div class="order-actions">
                        <div class="order-price">¥9.9/月</div>
                        <button class="btn btn-primary" onclick="window.location.href='package-detail.html'">重新订购</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <div class="nav-tabs">
                <div class="nav-item" onclick="window.location.href='index.html'">
                    <span>首页</span>
                </div>
                <div class="nav-item active">
                    <span>个人中心</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function confirmCancel() {
            if (confirm('确定要取消订购吗？取消后，会员权益将在当前周期结束后停止。')) {
                alert('取消订购成功！');
            }
        }
    </script>
</body>
</html>
