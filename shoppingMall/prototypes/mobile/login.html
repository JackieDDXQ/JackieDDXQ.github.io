<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>觉观商城 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            min-height: 100vh;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 60px;
        }
        
        .logo h1 {
            font-size: 24px;
            color: #1890ff;
        }
        
        .login-form {
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #666;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 16px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #1890ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .login-btn:hover {
            background-color: #40a9ff;
        }
        
        .third-party-login {
            text-align: center;
        }
        
        .third-party-login h3 {
            font-size: 14px;
            color: #999;
            margin-bottom: 20px;
            position: relative;
        }
        
        .third-party-login h3::before,
        .third-party-login h3::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background-color: #d9d9d9;
        }
        
        .third-party-login h3::before {
            left: 0;
        }
        
        .third-party-login h3::after {
            right: 0;
        }
        
        .login-icons {
            display: flex;
            justify-content: center;
            gap: 40px;
        }
        
        .login-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
        }
        
        .alipay {
            background-color: #1677ff;
            color: #fff;
        }
        
        .wechat {
            background-color: #07c160;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>觉观商城</h1>
        </div>
        
        <div class="login-form">
            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" placeholder="请输入手机号">
            </div>
            
            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label for="verificationCode">验证码</label>
                    <input type="text" id="verificationCode" placeholder="请输入验证码">
                </div>
                <button style="margin-top: 25px; padding: 0 15px; background-color: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">获取验证码</button>
            </div>
            
            <button class="login-btn" onclick="window.location.href='index.html'">登录</button>
        </div>
        
        <div class="third-party-login">
            <h3>其他登录方式</h3>
            <div class="login-icons">
                <div class="login-icon alipay" onclick="window.location.href='index.html'">
                    <span>支</span>
                </div>
                <div class="login-icon wechat" onclick="window.location.href='index.html'">
                    <span>微</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
